name: BestPharma scaffold
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: bestpharma/${{ matrix.app }}
