name: CI BEGPHARMA (Backend + Frontend)

on:
  push:
    branches: [ "main", "master", "sprint-*", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Tests (PHPUnit + PostgreSQL 16 RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bestpharma_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node pour la recette PostgreSQL
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test réel du chaînage PostgreSQL
        env:
          AUDIT_TEST_ADMIN_URL: postgres://postgres:password@127.0.0.1:5432/postgres
        run: |
          npm ci
          npm run test:audit-postgres

      - name: Configuration de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, json
          coverage: none

      - name: Installation des dépendances Composer
        run: |
          cd backend
          composer install --prefer-dist --no-progress --no-interaction

      - name: Préparation de l'environnement de test
        run: |
          cd backend
          cp .env.example .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=bestpharma_test/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env.testing
          php artisan key:generate --env=testing

      - name: Exécution des migrations PostgreSQL avec RLS et Triggers
        run: |
          cd backend
          php artisan migrate --env=testing --force

      - name: Exécution de la suite de tests automatisés (PHPUnit)
        run: |
          cd backend
          php artisan test

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances NPM
        run: |
          cd frontend
          npm ci

      - name: Exécution de la suite de tests Vitest
        run: |
          cd frontend
          npm test

      - name: Vérification des types
        working-directory: frontend
        run: npm run typecheck

      - name: Compilation de production
        working-directory: frontend
        run: npm run build

  referentiel-source:
    name: Vérification de l’extraction du guide ABMed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer l’outil d’extraction
        run: pip install -r scripts/requirements-referentiel.txt
      - name: Vérifier source, numérotation et reproductibilité
        run: python scripts/extraire-referentiel-abmed.py --check

      - name: Vérifier le rapprochement du corpus documentaire
        run: |
          pip install -r scripts/requirements-corpus.txt
          python scripts/rapprocher-corpus.py --check
          python -m unittest discover -s scripts/tests
